name: Update Premier League Predictions
 
on:
  schedule:
    # Runs once a day at 00:00 UTC. https://crontab.guru is handy if you want
    # to change this later.
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install numpy
 
      - name: Fetch standings and rebuild predictions
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_predictions.py
 
      - name: Commit and push if the table changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-table.html
          git diff --cached --quiet || git commit -m "Update predictions [automated]"
          git push
 
